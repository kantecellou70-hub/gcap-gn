name: CI/CD — GCAP-GN

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Secrets GitHub à configurer dans Settings → Secrets and variables → Actions :
#   VERCEL_TOKEN         → Vercel Dashboard → Account Settings → Tokens
#   VERCEL_ORG_ID        → Vercel Dashboard → Team Settings → General → Team ID
#   VERCEL_PROJECT_ID    → Vercel Dashboard → Project → Settings → General → Project ID
#   SUPABASE_ACCESS_TOKEN → Supabase Dashboard → Account → Access Tokens
#   SUPABASE_PROJECT_REF  → Supabase Dashboard → Project → Settings → General (ex: uhvjqfzzmepguatexguu)

jobs:
  # ─── Qualité & Tests ────────────────────────────────────────────────────────
  ci:
    name: Qualité & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — zéro erreur tolérée
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests RBAC & unitaires (63 tests)
        run: npm run test

      - name: Build de production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_DEFAULT_TENANT: mefb

  # ─── Déploiement Production (main) ─────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://gcap-gn.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build pour Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy en production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ─── Déploiement Preview (develop) ─────────────────────────────────────────
  deploy-preview:
    name: Deploy → Preview (staging)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build pour Vercel (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy en preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Commenter PR avec URL preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview déployé : ${{ steps.deploy.outputs.preview_url }}'
            })
